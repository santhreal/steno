name: cpu-ci

# Lightweight CPU gate: unit tests + clippy linked against CPU sherpa-onnx.
# Never starts the daemon, never uses DISPLAY/GNOME, never pulls CUDA.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, "1.85"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl \
            libasound2-dev \
            libx11-dev libxi-dev libxrandr-dev libxext-dev libxfixes-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Install Rust (${{ matrix.rust }} + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/steno/sherpa-onnx-cpu
            target
          key: cpu-ci-${{ matrix.rust }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cpu-ci-${{ matrix.rust }}-${{ runner.os }}-

      - name: CPU unit/clippy gate
        run: ./scripts/ci-cpu.sh
