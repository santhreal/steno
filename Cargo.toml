[package]
name = "light-dictate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal offline speech-to-text dictation CLI powered by sherpa-onnx (Parakeet TDT)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "dictate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Minimal CLI: skip colorized help; keep help/usage/error context/typo suggestions.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
cpal = "0.18"
# RUST_LOG regex filters and jiff timestamps are unused; keep terminal colors.
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
fontdue = "0.9"
hound = "3"
libc = "0.2"
log = "0.4"
# Only the sinc resampler is used; the default fft_resampler feature pulls in rustfft.
rubato = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
# Official safe wrapper; `shared` links the system sherpa-onnx (CUDA build
# in /usr/local/lib/sherpa-onnx, selected via SHERPA_ONNX_LIB_DIR at build
# time) instead of downloading the CPU-only prebuilt archive.
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }
tiny-skia = "0.11"
# Config and dictionary are only parsed, never serialized; skip the display feature.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
x11rb = { version = "0.14.0", features = ["randr", "shape", "xinput", "xtest"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
