[workspace]
resolver = "2"
members = [
    "crates/steno-core",
    "crates/steno-platform",
    "crates/steno",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/anionicsanth/Santh-backup"
description = "Minimal offline speech-to-text dictation CLI powered by sherpa-onnx (Parakeet TDT)"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
