[workspace]
resolver = "2"
members = [
    "crates/dictate-core",
    "crates/dictate-platform",
    "crates/dictate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Minimal offline speech-to-text dictation CLI powered by sherpa-onnx (Parakeet TDT)"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
