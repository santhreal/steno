[package]
name = "dictate-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OS backends for light-dictate: hotkey, overlay, typing (Linux X11 first)"

[dependencies]
anyhow = "1"
dictate-core = { path = "../dictate-core" }
fontdue = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "shape", "xinput", "xtest"] }
