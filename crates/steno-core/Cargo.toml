[package]
name = "steno-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embeddable offline STT engine (Parakeet/sherpa-onnx): audio, DSP, text pipeline, config, API types"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.18"
hound = "3"
libc = "0.2"
log = "0.4"
rubato = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = "0.22"

# LLM refine backend (optional). Enable via features:
#   --features llm         → CPU-only LLM inference
#   --features llm-cuda    → NVIDIA GPU offload
#   --features llm-vulkan  → AMD/Intel/NVIDIA Vulkan
#   --features llm-metal   → macOS Metal
# At runtime, n_gpu_layers in [refine.llm] controls GPU offload (0 = CPU).
llama-cpp-2 = { version = "0.1", optional = true, default-features = false, features = ["sampler"] }

[features]
default = []
llm = ["dep:llama-cpp-2"]
llm-cuda = ["llm", "llama-cpp-2/cuda"]
llm-vulkan = ["llm", "llama-cpp-2/vulkan"]
llm-metal = ["llm", "llama-cpp-2/metal"]
