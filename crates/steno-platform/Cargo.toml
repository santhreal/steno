[package]
name = "steno-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OS backends for steno: hotkey, overlay, typing (Linux X11 + Wayland MVP)"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
steno-core = { path = "../steno-core" }
fontdue = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "shape", "xinput", "xtest"] }
x11rb-protocol = "0.14.0"
wayland-client = { version = "0.31", optional = true }
smithay-client-toolkit = { version = "0.21", optional = true, default-features = false, features = ["calloop"] }
evdev = { version = "0.12", optional = true }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[features]
wayland = ["dep:wayland-client", "dep:smithay-client-toolkit", "dep:evdev"]
